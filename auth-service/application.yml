server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    # Aiven MySQL - saari values Render environment variables se aayengi
    url: ${AIVEN_AUTH_DB_URL}
    username: ${AIVEN_AUTH_DB_USER}
    password: ${AIVEN_AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}

jwt:
  secret: ${JWT_SECRET:qmsMicroservicesSecretKeyForJwtToken2024VeryLongSecretKey}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "*"
