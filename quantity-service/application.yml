server:
  port: ${PORT:8082}

spring:
  application:
    name: quantity-service

  datasource:
    # Aiven MySQL - saari values Render environment variables se aayengi
    url: ${AIVEN_QUANTITY_DB_URL}
    username: ${AIVEN_QUANTITY_DB_USER}
    password: ${AIVEN_QUANTITY_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}

jwt:
  secret: ${JWT_SECRET:qmsMicroservicesSecretKeyForJwtToken2024VeryLongSecretKey}

management:
  endpoints:
    web:
      exposure:
        include: "*"
