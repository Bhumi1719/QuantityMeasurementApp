server:
  port: ${PORT:8082}

spring:
  application:
    name: quantity-service

  datasource:
    url: ${AIVEN_QUANTITY_DB_URL}
    username: ${AIVEN_DB_USERNAME}
    password: ${AIVEN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET:qmsMicroservicesSecretKeyForJwtToken2024VeryLongSecretKey}

management:
  endpoints:
    web:
      exposure:
        include: "health"
