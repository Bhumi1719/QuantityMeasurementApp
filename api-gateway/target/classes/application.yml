server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:http://localhost:4200}"
              - "https://*.onrender.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # Auth Service Routes
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Quantity Service Routes
        - id: quantity-service
          uri: ${QUANTITY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/quantities/**

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "health"
